version: '3.8'

services:
  postgres:
    image: postgres:16
    container_name: academathon-postgres
    environment:
      POSTGRES_DB: academathon
      POSTGRES_USER: academathon
      POSTGRES_PASSWORD: academathonpass
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  postgres_data:

