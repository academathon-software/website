spring.application.name=academathon
spring.datasource.url=jdbc:postgresql://localhost:5433/academathon
spring.datasource.username=academathon
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.flyway.validate-on-migrate=true

# JWT secret key (must be at least 256 bits for HMAC-SHA256)
security.jwt.secret-key=${JWT_SECRET_KEY}
security.jwt.expiration-time=3600000
#
# Mail properties
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=academathontutoring@gmail.com
spring.mail.password=${MAIL_PASSWORD}

spring.config.import=optional:file:.env[.properties]

server.port=8080

# Frontend URL (used for email links)
app.frontend.url=https://academathon.com

# AWS S3 Configuration
aws.s3.bucket-name=academathon-uploads
aws.s3.region=ca-central-1
aws.s3.access-key=${AWS_ACCESS_KEY}
aws.s3.secret-key=${AWS_SECRET_KEY}

# File upload settings
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

# Stripe Configuration
stripe.api.key=${STRIPE_API_KEY}
stripe.webhook.secret=${STRIPE_WEBHOOK_SECRET}

# Booking timing configuration (in hours)
booking.minimum.advance.hours=48
booking.tutor.response.hours=24
booking.payment.deadline.hours=24
booking.reschedule.minimum.hours=24
booking.reschedule.tutor.response.hours=12