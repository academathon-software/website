spring.application.name=academathon

# Load secrets from .env (looked up at every realistic working-dir relative to the project)
spring.config.import=optional:file:.env[.properties],optional:file:./Backend/.env[.properties],optional:file:./website/Backend/.env[.properties],optional:file:./website/website/Backend/.env[.properties]

server.port=8080

# ----- Database -----
spring.datasource.url=jdbc:postgresql://localhost:5433/academathon
spring.datasource.username=academathon
spring.datasource.password=${DB_PASSWORD:academathonpass}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.flyway.validate-on-migrate=true
# repair-before-migrate behavior lives in com.academathon.config.FlywayConfig

# ----- Security / JWT -----
security.jwt.secret-key=${JWT_SECRET_KEY:myVerySecretKeyThatIsAtLeast256BitsLongForJWTTokenGenerationAndSecurity}
security.jwt.expiration-time=3600000

# ----- Frontend URL (used in email links) -----
app.frontend.url=${APP_FRONTEND_URL:https://academathon.ca}

# ----- Mail (Resend SMTP) -----
spring.mail.host=smtp.resend.com
spring.mail.port=587
spring.mail.username=resend
spring.mail.password=${RESEND_API_KEY}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# Sender identity (from-address must be on a domain verified in Resend)
app.email.from-address=${EMAIL_FROM_ADDRESS:noreply@academathon.ca}
app.email.from-name=${EMAIL_FROM_NAME:Academathon}
app.email.reply-to=${EMAIL_REPLY_TO:academathontutoring@gmail.com}

# ----- AWS S3 (set AWS_S3_* in .env) -----
aws.s3.bucket-name=${AWS_S3_BUCKET_NAME}
aws.s3.region=${AWS_S3_REGION}
aws.s3.access-key=${AWS_S3_ACCESS_KEY}
aws.s3.secret-key=${AWS_S3_SECRET_KEY}

# ----- File uploads -----
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

# ----- Stripe (set STRIPE_API_KEY and STRIPE_WEBHOOK_SECRET in .env) -----
stripe.api.key=${STRIPE_API_KEY}
stripe.webhook.secret=${STRIPE_WEBHOOK_SECRET}

# ----- LiveKit (voice agent) -----
livekit.api-key=${LIVEKIT_API_KEY}
livekit.api-secret=${LIVEKIT_API_SECRET}
livekit.url=${LIVEKIT_URL}

# ----- Booking timing (hours) -----
# All deadlines are anchored to the lesson start time.
booking.minimum.advance.hours=5
booking.tutor.response.before.lesson.hours=3
booking.reschedule.request.before.lesson.hours=2
booking.reschedule.response.before.lesson.hours=1
booking.cancellation.before.lesson.hours=1
