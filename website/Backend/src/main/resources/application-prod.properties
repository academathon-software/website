# Production Configuration for Supabase + Render Deployment

spring.application.name=academathon

# Database Configuration (Supabase PostgreSQL)
# These values are set via environment variables on Render
spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_USERNAME}
spring.datasource.password=${DATABASE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# HikariCP Configuration - Disable prepared statements for Supabase Transaction Pooler
spring.datasource.hikari.data-source-properties.prepareThreshold=0
spring.datasource.hikari.data-source-properties.preparedStatementCacheQueries=0
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=2

# JPA/Hibernate Configuration
spring.jpa.hibernate.ddl-auto=none
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.jdbc.batch_size=0

# Flyway Configuration
# repair-before-migrate behavior is wired in com.academathon.config.FlywayConfig
# (Spring Boot does not expose a `spring.flyway.repair-on-migrate` property,
# so it has to be a FlywayMigrationStrategy bean).
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.validate-on-migrate=false
spring.flyway.locations=classpath:db/migration

# JWT Configuration
security.jwt.secret-key=${JWT_SECRET_KEY}
security.jwt.expiration-time=3600000

# Mail Configuration (Resend SMTP - matches dev so the EmailService behaves identically)
spring.mail.host=smtp.resend.com
spring.mail.port=587
spring.mail.username=resend
spring.mail.password=${RESEND_API_KEY}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# Sender identity (from-address must be on a domain verified in Resend).
# EmailService falls back to the defaults inline (noreply@academathon.ca / Academathon /
# academathontutoring@gmail.com) if these env vars are unset, but it's cleaner to
# wire them explicitly so prod and dev stay aligned.
app.email.from-address=${EMAIL_FROM_ADDRESS:noreply@academathon.ca}
app.email.from-name=${EMAIL_FROM_NAME:Academathon}
app.email.reply-to=${EMAIL_REPLY_TO:academathontutoring@gmail.com}

# AWS S3 Configuration
aws.s3.bucket-name=${AWS_S3_BUCKET_NAME}
aws.s3.region=${AWS_S3_REGION}
aws.s3.access-key=${AWS_S3_ACCESS_KEY}
aws.s3.secret-key=${AWS_S3_SECRET_KEY}

# File upload settings
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

# Stripe Configuration
stripe.api.key=${STRIPE_API_KEY}
stripe.webhook.secret=${STRIPE_WEBHOOK_SECRET}

# Server Configuration
server.port=${PORT:8080}

# Frontend URL (used for email links and logo)
app.frontend.url=https://academathon.ca

# CORS Configuration (adjust for your Vercel frontend domain)
# This is typically handled in your WebConfig or SecurityConfig

# Booking timing configuration (in hours)
# All deadlines are anchored to the lesson start time.
booking.minimum.advance.hours=5
booking.tutor.response.before.lesson.hours=3
booking.reschedule.request.before.lesson.hours=2
booking.reschedule.response.before.lesson.hours=1
booking.cancellation.before.lesson.hours=1

# Logging (reduce verbosity in production)
logging.level.root=WARN
logging.level.com.academathon=INFO
logging.level.org.springframework.web=WARN
logging.level.org.hibernate=WARN

# Actuator Configuration (for health checks)
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never
